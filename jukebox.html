<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our little jukebox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root {
  --wine: #2b1220;
  --wine-dark: #1a0a14;
  --walnut: #5a3820;
  --walnut-dark: #36200f;
  --butter: #f2c66d;
  --rose: #ec8f9b;
  --paper: #f7ebd4;
  --ink: #4a2a2f;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Caveat', 'Comic Sans MS', cursive;
  color: var(--paper);
  background:
    radial-gradient(circle at 20% 10%, rgba(236,143,155,.2), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(242,198,109,.12), transparent 40%),
    var(--wine);
  padding: 28px 16px 60px;
  overflow-x: hidden;
}

header { text-align: center; margin-bottom: 34px; }

h1 {
  font-family: 'Fraunces', Georgia, serif;
  font-style: italic;
  font-weight: 600;
  font-size: clamp(2.2rem, 6vw, 3.4rem);
  margin: 0;
  color: var(--butter);
  text-shadow: 0 3px 0 rgba(0,0,0,.35);
  transform: rotate(-1.5deg);
}
h1 .beat { display: inline-block; color: var(--rose); animation: beat 1.4s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.18); } }

header p { margin: 8px 0 0; font-size: 1.6rem; color: var(--rose); }

.stage {
  display: flex;
  flex-wrap: wrap;
  gap: 50px;
  justify-content: center;
  align-items: flex-start;
  max-width: 1050px;
  margin: 0 auto;
}

/* ---------- turntable ---------- */
.left { display: flex; flex-direction: column; align-items: center; gap: 22px; }

.deck {
  position: relative;
  width: 400px;
  height: 340px;
  flex: none;
  border-radius: 18px;
  background:
    repeating-linear-gradient(92deg, rgba(0,0,0,.07) 0 2px, transparent 2px 7px),
    linear-gradient(145deg, var(--walnut), var(--walnut-dark));
  border: 3px solid #2a170a;
  box-shadow: 0 22px 40px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.12);
}

.platter {
  position: absolute;
  left: 25px; top: 25px;
  width: 290px; height: 290px;
  border-radius: 50%;
  background: radial-gradient(circle, #2e2e2e 0 60%, #1b1b1b 100%);
  box-shadow: inset 0 0 0 6px #3b3b3b, 0 6px 14px rgba(0,0,0,.6);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}

.hint-on-platter {
  font-size: 1.45rem;
  text-align: center;
  color: #b49a8c;
  padding: 0 50px;
  line-height: 1.1;
  pointer-events: none;
  transform: rotate(-3deg);
}
.hint-on-platter b { color: var(--rose); font-weight: 500; }

.platter.over { box-shadow: inset 0 0 0 6px var(--rose), 0 0 24px var(--rose); }

.record {
  position: absolute;
  width: 270px; height: 270px;
  border-radius: 50%;
  background:
    conic-gradient(from 30deg, rgba(255,255,255,.14), transparent 18%, transparent 50%, rgba(255,255,255,.12) 62%, transparent 76%),
    repeating-radial-gradient(#0d0d0d 0 2px, #1d1d1d 3px 4px);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 12px rgba(0,0,0,.8);
  animation: drop-in .55s cubic-bezier(.3,1.4,.5,1) both;
}
.record .spin {
  position: absolute; inset: 0; border-radius: 50%;
  animation: spin 3.2s linear infinite;
  display: flex; align-items: center; justify-content: center;
  background: conic-gradient(from 0deg, transparent 0 24%, rgba(255,255,255,.07) 25%, transparent 27% 74%, rgba(255,255,255,.07) 75%, transparent 77%);
}
.record.paused .spin { animation-play-state: paused; }
.record.leaving { animation: lift-out .5s ease-in forwards; }

.label {
  width: 96px; height: 96px; border-radius: 50%;
  background-size: cover; background-position: center;
  border: 4px solid var(--butter);
  display: flex; align-items: center; justify-content: center;
}
.label::after {
  content: ''; width: 12px; height: 12px; border-radius: 50%;
  background: var(--wine-dark); border: 2px solid #bbb;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drop-in { from { transform: translateY(-60px) scale(1.15); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lift-out { to { transform: translateY(-70px) scale(1.12); opacity: 0; } }

/* tonearm */
.pivot {
  position: absolute; right: 30px; top: 30px;
  width: 44px; height: 44px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #eee, #8a8a8a);
  box-shadow: 0 3px 6px rgba(0,0,0,.5);
  z-index: 11;
}
.tonearm {
  position: absolute; right: 48px; top: 48px;
  width: 8px; height: 175px;
  margin-right: -4px;
  transform-origin: 4px 4px;
  transform: rotate(6deg);
  transition: transform .9s cubic-bezier(.5,0,.3,1);
  z-index: 10;
  pointer-events: none;
}
.tonearm.down { transform: rotate(38deg); }
.tonearm::before {
  content: ''; position: absolute; inset: 0; border-radius: 4px;
  background: linear-gradient(90deg, #999, #fff, #888);
  box-shadow: 2px 3px 5px rgba(0,0,0,.45);
}
.tonearm::after {
  content: ''; position: absolute; left: -4px; bottom: -10px;
  width: 16px; height: 30px; border-radius: 3px; background: #222;
  border-bottom: 4px solid var(--rose);
}

/* button */
.eject {
  font-family: inherit; font-size: 1.6rem; font-weight: 700;
  color: var(--ink); background: var(--butter);
  border: 0; border-radius: 30px; padding: 6px 26px 8px;
  cursor: pointer;
  box-shadow: 0 4px 0 #b88b34;
  transition: transform .1s, box-shadow .1s, opacity .2s;
}
.eject:hover:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #b88b34; }
.eject:disabled { opacity: .35; cursor: default; }
.eject:focus-visible, .sleeve:focus-visible { outline: 3px solid var(--rose); outline-offset: 4px; }

/* love note */
.note {
  position: relative;
  width: 340px;
  min-height: 130px;
  padding: 26px 24px 22px;
  background: var(--paper);
  color: var(--ink);
  font-size: 1.75rem;
  line-height: 1.05;
  text-align: center;
  transform: rotate(1.6deg);
  box-shadow: 0 8px 18px rgba(0,0,0,.4);
  display: flex; align-items: center; justify-content: center;
  background-image: repeating-linear-gradient(transparent 0 31px, rgba(236,143,155,.25) 31px 32px);
}
.note::before {
  content: ''; position: absolute; top: -13px; left: 50%;
  width: 90px; height: 26px; margin-left: -45px;
  background: rgba(242,198,109,.75); transform: rotate(-3deg);
}
.note::after {
  content: '♥'; position: absolute; right: 12px; bottom: 6px;
  font-size: 1.3rem; color: var(--rose);
}
.note span { transition: opacity .35s; }
.note span.fade { opacity: 0; }

.now { font-size: 1.5rem; color: var(--butter); min-height: 1.5em; text-align: center; max-width: 380px; }

/* ---------- shelf ---------- */
.shelf {
  flex: 1; min-width: 300px; max-width: 560px;
  background: linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.14));
  border-radius: 10px 10px 22px 22px;
  padding: 20px 26px 28px;
  border-bottom: 14px solid var(--walnut);
}
.shelf h2 {
  font-size: 2.2rem; margin: 0 0 22px; color: var(--rose);
  transform: rotate(-1deg);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
  gap: 26px 20px;
}

.sleeve {
  all: unset;
  cursor: grab;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  transition: transform .2s, opacity .3s, filter .3s;
}
.sleeve:hover { transform: translateY(-6px) rotate(0deg) !important; }
.sleeve .cover {
  position: relative;
  width: 125px; height: 125px;
  background-size: cover; background-position: center;
  border-radius: 3px;
  box-shadow: 4px 5px 10px rgba(0,0,0,.55);
}
/* little piece of tape on each cover */
.sleeve .cover::after {
  content: ''; position: absolute; top: -8px; left: 50%;
  width: 40px; height: 14px; margin-left: -20px;
  background: rgba(247,235,212,.7); transform: rotate(var(--tape, 3deg));
}
.sleeve .name {
  font-size: 1.3rem; line-height: 1; text-align: center; color: var(--paper);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  max-width: 130px;
}
.sleeve.away { opacity: .35; filter: grayscale(.7); pointer-events: none; }
.sleeve.away .cover::before {
  content: 'playing ♡'; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(26,10,20,.55); color: var(--butter); font-size: 1.5rem;
}

/* hearts */
.heart {
  position: fixed; z-index: 50; pointer-events: none;
  color: var(--rose);
  animation: float-up var(--d, 6s) ease-out forwards;
  text-shadow: 0 0 8px rgba(236,143,155,.5);
}
@keyframes float-up {
  from { opacity: 0; transform: translate(0, 0) scale(.5) rotate(0deg); }
  12% { opacity: 1; }
  to { opacity: 0; transform: translate(var(--x, 0), var(--y, -300px)) scale(1) rotate(var(--r, 20deg)); }
}

#yt-wrap {
  position: fixed; bottom: 0; right: 0;
  width: 200px; height: 200px;
  opacity: .01; pointer-events: none; z-index: -1;
}

@media (max-width: 460px) {
  .deck { transform: scale(.82); margin: -30px -36px; }
  .note { width: 300px; }
}
@media (prefers-reduced-motion: reduce) {
  .record .spin { animation-duration: 12s; }
  .heart, h1 .beat { animation: none; display: none; }
}
</style>
</head>
<body>

<header>
  <h1>Our little jukebox <span class="beat">♥</span></h1>
  <p>pick a record, put it on the turntable and let the love play ♡</p>
</header>

<div class="stage">
  <div class="left">
    <div class="deck">
      <div class="platter" id="platter" title="Click to pause / play">
        <div class="hint-on-platter" id="platter-hint">drag a record here,<br>or just click one <b>♡</b></div>
      </div>
      <div class="pivot"></div>
      <div class="tonearm" id="tonearm"></div>
    </div>

    <div class="now" id="now">waiting for a song to love…</div>
    <button class="eject" id="eject" disabled>Take the record off</button>

    <div class="note"><span id="note-text">Hi you. I saved this little corner of the internet just for you ♡</span></div>
  </div>

  <div class="shelf">
    <h2>Our records ♡</h2>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="yt-wrap"><div id="yt-player"></div></div>

<script>
// the songs (YouTube video ids)
const tracks = [
  { id: "7CgvjSxrND8", title: "Track 1" },
  { id: "jYTGnTv-CKg", title: "Track 2" },
  { id: "ygJZUlJ-uZI", title: "Track 3" },
  { id: "U8ai37gFvMk", title: "Track 4" },
  { id: "IqxySvn913Q", title: "Track 5" },
  { id: "kPkft7RLX9s", title: "Track 6" },
  { id: "-F-JfWqMG6g" , title: "Track 7" },
  { id: "elueA2rofoo", title: "Track 8" },
  { id: "Kr4EQDVETuA", title: "Track 9" }
];
tracks.forEach(t => t.cover = `https://img.youtube.com/vi/${t.id}/hqdefault.jpg`);

// ---- sweet messages ----
const whenPlaced = [
  "Good choice. You always know exactly what I need to hear.",
  "This one is for you. Always you.",
  "Here we go. Stay as long as you like.",
  "I hope this song feels like a hug.",
  "Ooh, I love this one. I love that you love it too.",
  "Come closer, the best part is just starting."
];
const whileListening = [
  "You make ordinary days feel like favorite songs.",
  "Somewhere, someone is very lucky to have you. (It's me.)",
  "My favorite sound is still your laugh.",
  "Today's reminder: you are wonderful, and very loved.",
  "Thank you for being exactly you.",
  "If I could, I'd press pause on this moment and keep it forever.",
  "You're my favorite hello and my hardest goodbye.",
  "Every song is a little better when I think of you.",
  "Your smile could fix a whole bad day. It fixed mine.",
  "I love you more than all these records put together."
];
const whenPaused = [
  "Shh… even the silence is nice with you.",
  "The record is resting. So can you."
];
const whenRemoved = [
  "Gently lifted, the way I'd hold your hand.",
  "Until the next song. I'll be right here.",
  "Every record needs a rest. You do too, you know."
];
const whenSkipped = [
  "Let's try another one, sweetheart. I have a feeling you'll love it.",
  "That one's shy today. Here's something else for you."
];
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---- elements ----
const grid = document.getElementById('grid');
const platter = document.getElementById('platter');
const hint = document.getElementById('platter-hint');
const tonearm = document.getElementById('tonearm');
const nowEl = document.getElementById('now');
const ejectBtn = document.getElementById('eject');
const noteText = document.getElementById('note-text');

let player = null, ready = false, pendingIndex = null, current = null;
let noteTimer = null, heartTimer = null, failStreak = 0;

// ---- shelf ----
// every cover is a little crooked, like it was placed by hand
const tilts = [-2.5, 1.8, -1, 2.6, -1.8, 1, -2.2];
tracks.forEach((t, i) => {
  const s = document.createElement('button');
  s.className = 'sleeve';
  s.draggable = true;
  s.style.transform = `rotate(${tilts[i % tilts.length]}deg)`;
  s.style.setProperty('--tape', (i % 2 ? -4 : 4) + 'deg');
  s.innerHTML = `<div class="cover" style="background-image:url('${t.cover}')"></div><div class="name">${t.title}</div>`;
  s.addEventListener('click', () => place(i));
  s.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', i));
  grid.appendChild(s);
});

// ---- drag & drop onto the platter ----
platter.addEventListener('dragover', e => { e.preventDefault(); platter.classList.add('over'); });
platter.addEventListener('dragleave', () => platter.classList.remove('over'));
platter.addEventListener('drop', e => {
  e.preventDefault();
  platter.classList.remove('over');
  const i = e.dataTransfer.getData('text/plain');
  if (i !== '') place(Number(i));
});

// ---- YouTube ----
const ytScript = document.createElement('script');
ytScript.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytScript);

function onYouTubeIframeAPIReady() {
  player = new YT.Player('yt-player', {
    width: 200, height: 200,
    playerVars: { playsinline: 1, controls: 0, rel: 0 },
    events: {
      onReady() {
        ready = true;
        if (pendingIndex !== null) { place(pendingIndex); pendingIndex = null; }
      },
      onStateChange(e) {
        if (e.data === YT.PlayerState.PLAYING) failStreak = 0;
        if (e.data === YT.PlayerState.ENDED) place((current + 1) % tracks.length);
      },
      onError() {
        // a video that can't play just gets skipped, quietly
        failStreak++;
        if (failStreak >= tracks.length) { putBack(current); return; }
        place((current + 1) % tracks.length, true);
        say(pick(whenSkipped));
      }
    }
  });
}

// ---- put a record on ----
function place(i, skipped) {
  i = Number(i);
  if (current !== null) putBack(current, true);

  const t = tracks[i];
  current = i;
  hint.style.display = 'none';

  const rec = document.createElement('div');
  rec.className = 'record';
  rec.innerHTML = `<div class="spin"><div class="label" style="background-image:url('${t.cover}')"></div></div>`;
  platter.appendChild(rec);

  grid.children[i].classList.add('away');
  setTimeout(() => tonearm.classList.add('down'), 450);
  nowEl.textContent = 'now playing: ' + t.title + ' ♡';
  ejectBtn.disabled = false;

  if (!skipped) say(pick(whenPlaced));
  startExtras();
  burst(platterCenter(), 16);

  if (!ready) { pendingIndex = i; return; }
  player.loadVideoById(t.id);
  player.unMute();
  player.setVolume(100);
}

// ---- take the record off ----
function putBack(i, silent) {
  const rec = document.querySelector('.record');
  if (rec) {
    rec.classList.add('leaving');
    setTimeout(() => rec.remove(), 480);
  }
  grid.children[i].classList.remove('away');
  if (silent) return;

  if (ready) player.stopVideo();
  tonearm.classList.remove('down');
  hint.style.display = '';
  nowEl.textContent = 'waiting for a song to love…';
  ejectBtn.disabled = true;
  stopExtras();
  say(pick(whenRemoved));
  burst(platterCenter(), 8);
  current = null;
  pendingIndex = null;
}
ejectBtn.addEventListener('click', () => { if (current !== null) putBack(current); });

// ---- click the platter to pause / play ----
platter.addEventListener('click', () => {
  const rec = document.querySelector('.record');
  if (!ready || current === null || !rec) return;
  if (player.getPlayerState() === YT.PlayerState.PLAYING) {
    player.pauseVideo();
    rec.classList.add('paused');
    tonearm.classList.remove('down');
    say(pick(whenPaused));
  } else {
    player.playVideo();
    rec.classList.remove('paused');
    tonearm.classList.add('down');
    say(pick(whileListening));
  }
});

// ---- love note ----
function say(text) {
  noteText.classList.add('fade');
  setTimeout(() => { noteText.textContent = text; noteText.classList.remove('fade'); }, 350);
}
function startExtras() {
  stopExtras();
  noteTimer = setInterval(() => say(pick(whileListening)), 10000);
  heartTimer = setInterval(rise, 450);
}
function stopExtras() { clearInterval(noteTimer); clearInterval(heartTimer); }

// ---- hearts everywhere ----
const shapes = ['♡', '♥', '❤', '💗', '💕', '💖'];

function makeHeart(x, y, rise, spread, dur) {
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = pick(shapes);
  h.style.left = x + 'px';
  h.style.top = y + 'px';
  h.style.fontSize = 14 + Math.random() * 24 + 'px';
  h.style.setProperty('--x', (Math.random() * spread * 2 - spread) + 'px');
  h.style.setProperty('--y', -rise + 'px');
  h.style.setProperty('--r', (Math.random() * 70 - 35) + 'deg');
  h.style.setProperty('--d', dur + 's');
  document.body.appendChild(h);
  setTimeout(() => h.remove(), dur * 1000 + 200);
}

// hearts drifting up from the bottom of the screen
function rise() {
  const n = 1 + Math.floor(Math.random() * 2);
  for (let k = 0; k < n; k++) {
    makeHeart(Math.random() * innerWidth, innerHeight + 10, innerHeight + 80, 70, 5 + Math.random() * 4);
  }
}
// a little burst from one spot
function burst(p, n) {
  for (let k = 0; k < n; k++) {
    makeHeart(p.x, p.y, 90 + Math.random() * 180, 110, 1.6 + Math.random() * 1.6);
  }
}
function platterCenter() {
  const r = platter.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

// ambient hearts even when nothing is playing
setInterval(() => { if (current === null) rise(); }, 2200);

// hearts wherever you click or tap
document.addEventListener('pointerdown', e => burst({ x: e.clientX, y: e.clientY }, 5));

// ---- real song titles ----
tracks.forEach((t, i) => {
  fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${t.id}`)
    .then(r => r.json())
    .then(d => {
      if (!d.title) return;
      t.title = d.title;
      grid.children[i].querySelector('.name').textContent = d.title;
      if (current === i) nowEl.textContent = 'now playing: ' + d.title + ' ♡';
    })
    .catch(() => {});
});
</script>
</body>
</html>
